name: Deploy to GitHub Pages

# Netlify is the canonical host (see SEO_BUILD_LOG.md, Phase 4) — it serves
# waznarabic.com with real redirects and cache headers, which GitHub Pages
# can't do. Auto-deploy here is disabled so the same content doesn't end up
# indexed at two origins; kept as workflow_dispatch in case Netlify is ever
# down and a manual GitHub Pages fallback is needed.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # vite build strips types without checking them, so an undefined name
      # compiles happily and blanks the app at runtime. That shipped once.
      # These two gates run before the build so it cannot happen again.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
